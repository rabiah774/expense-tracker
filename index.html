<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

   <header class="top-header">
    <div class="header-inner">
      <h1>Budget Planner</h1>

      <nav class="sub-nav">
   <ul>
    <li class="active"><a href="#">Dashboard</a></li>
    <li><a href="#">Add Expense</a></li>
    <li><a href="#">History</a></li>
    <li><a href="#">Settings</a></li>
   </ul>
</nav>
    </div>
  </header>
   <div class="main">
    
     <div class="left">
          <div class="budget-form">
            <h2>Set Your Budget</h2>
            <input type="number" id="budget-input" placeholder="Enter your budget">
            <button id="set-budget-btn">Add Budget</button>
          </div>
         

        <div class="expense-form">
            <h2>Add Expense</h2>
            <input type="text" id="expense-name-input" placeholder="Expense Name">
            <input type="number" id="expense-amount-input" placeholder="Expense Amount">
            <button id="add-expense-btn">Add Expense</button>
        </div>
      </div>
     

       <div class="right">
         <div class="expense-history">
            <p>Total Budget: $<span id="total-budget">0</span></p>
            <p>Total Expenses: $<span id="total-expenses">0</span></p>
            <p>Remaining Balance: $<span id="remaining-balance">0</span></p>
        </div>

        <div id="expense-list">
            <h2>Expense List</h2>
            <ul id="expenses-ul"></ul>
        </div>
       </div>
   </div>
    




    
</body>
</html>
